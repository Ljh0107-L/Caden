name: Release

# Build the DMG and publish a GitHub Release. Tag a commit with the version
# from package.json:
#
#   git tag v0.1.0 && git push --tags
#
# The app is ad-hoc signed and not notarized, so first launch on another
# machine is the Privacy & Security "Open Anyway" dance -- the release notes
# say so, and README walks through it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Version matches the tag
        run: |
          V="v$(node -p "require('./package.json').version")"
          [ "$V" = "${GITHUB_REF_NAME}" ] \
            || { echo "tag ${GITHUB_REF_NAME} does not match package.json ($V)"; exit 1; }

      - run: npm install

      - run: scripts/build-app.sh

      # Notes come from CHANGELOG.md, so a release says what the changelog
      # says. A tag with no section there fails here rather than publishing
      # an empty release.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/release-notes.sh "$(node -p "require('./package.json').version")" > dist/release-notes.md

          # Create on the first run, update on a re-run. A run that uploaded the
          # DMG and then failed afterwards used to be unrepeatable: the retry hit
          # "release already exists" and stopped. Re-running is now the fix for a
          # half-finished publish rather than another way to fail.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "Caden ${GITHUB_REF_NAME}" \
              --notes-file dist/release-notes.md
            gh release upload "${GITHUB_REF_NAME}" dist/Caden-*.dmg --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/Caden-*.dmg \
              --title "Caden ${GITHUB_REF_NAME}" \
              --notes-file dist/release-notes.md
          fi
